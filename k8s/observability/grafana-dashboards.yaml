apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: shop
data:
  api-metrics.json: |
    {
      "uid": "shop-api-metrics",
      "title": "Shop API Metrics (RED)",
      "tags": ["shop", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s) by service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency (s) by service",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket[5m])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate (4xx/5xx req/s) by service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{status=~\"4..|5..\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Orders created vs failed (per min)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "rate(shop_order_created_total[1m]) * 60", "legendFormat": "created"},
            {"expr": "rate(shop_order_failed_total[1m]) * 60", "legendFormat": "failed"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Payments approved vs declined (per min)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (status) (rate(shop_payment_result_total[1m])) * 60",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Top endpoints by request rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "topk(10, sum by (service, uri, method) (rate(http_server_requests_seconds_count[1m])))",
              "legendFormat": "{{service}} {{method}} {{uri}}"
            }
          ]
        }
      ]
    }
