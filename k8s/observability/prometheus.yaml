# Prometheus scrapes each service's Micrometer endpoint (/actuator/prometheus) directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shop
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'shop-services'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway-service:8080']
            labels: {service: gateway-service}
          - targets: ['order-service:8081']
            labels: {service: order-service}
          - targets: ['product-service:8082']
            labels: {service: product-service}
          - targets: ['payment-service:8083']
            labels: {service: payment-service}

      # Tempo's metrics-generator exposes RED metrics + service-graph metrics for the Grafana service map.
      - job_name: 'tempo'
        static_configs:
          - targets: ['tempo:3200']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shop
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --enable-feature=exemplar-storage
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: shop
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
