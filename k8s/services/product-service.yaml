apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shop
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            # ---- OpenTelemetry agent configuration (read by the -javaagent baked into the image) ----
            - name: OTEL_SERVICE_NAME
              value: product-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER     # metrics come from Micrometer/Prometheus, not the agent
              value: none
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
              value: "*"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=shop,deployment.environment=lab
          # startupProbe guards the slow JVM + OTel-agent boot: liveness/readiness don't start
          # until it passes, so the pod won't be killed mid-startup (up to ~200s of grace).
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shop
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
